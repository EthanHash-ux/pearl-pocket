plugins { id 'com.android.application' }

android {
    namespace 'ai.pearl.wallet'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'ai.pearl.wallet'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = false }
    sourceSets { test.resources.srcDir 'src/main/assets' }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    // 5.3.2 supports this project's API 35 toolchain; 5.5 requires API 37.
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}

def nativeCore = tasks.register('buildPearlCore', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/build_native.sh'
    environment 'ANDROID_SDK_ROOT', android.sdkDirectory.absolutePath
    inputs.files(fileTree('../core') { include '**/*.go', '**/*.c', 'go.mod', 'go.sum' }, file('../scripts/build_native.sh'))
    outputs.files(file('src/main/jniLibs/arm64-v8a/libpearlcore.so'), file('src/main/jniLibs/x86_64/libpearlcore.so'))
}
tasks.named('preBuild').configure { dependsOn nativeCore }
